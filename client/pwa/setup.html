<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icons/icon-192.png"><title>Set up Callie</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0d;color:#f4f4f5;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:20px}
.card{width:100%;max-width:440px;background:#141417;border:1px solid #26262b;border-radius:24px;padding:32px;text-align:center}
img{width:84px;height:84px;border-radius:20px}h1{margin:14px 0 6px;font-size:1.6rem}p{color:#8b8b93;line-height:1.55;margin:0 0 18px}
a{color:#22c55e}input{width:100%;padding:14px;border-radius:14px;border:1px solid #33333a;background:#0b0b0d;color:#fff;font:inherit;font-size:16px;margin-bottom:12px}
button{width:100%;padding:14px;border:0;border-radius:14px;background:#22c55e;color:#04210f;font:inherit;font-weight:700;cursor:pointer}
#msg{min-height:1.3em;margin:12px 0 0;color:#ffb4b4;font-size:.9rem}small{display:block;margin-top:22px;color:#6c6c75}
</style></head><body><div class="card">
<img src="icons/icon-192.png" alt=""><h1>Set up Callie</h1>
<p>Callie needs a free access key to talk. Create one in a minute at <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>, then paste it here. It is saved only on this computer.</p>
<input id="key" type="password" placeholder="Paste your access key" autocomplete="off">
<p style="margin-bottom:10px">Optional, for Luganda: a free token from <a href="https://api.sunbird.ai" target="_blank" rel="noopener">api.sunbird.ai</a>. You can leave it empty.</p>
<input id="sun" type="password" placeholder="Paste your Luganda token (optional)" autocomplete="off">
<button id="go">Save and start</button><p id="msg"></p><small>Built in Uganda, by Bryt Ma Tech UG</small></div>
<script>
const $ = id => document.getElementById(id);
const ping = () => fetch("/api/ping", { method: "POST" }).catch(() => {}); ping(); setInterval(ping, 20000);
$("go").onclick = async () => {
  $("msg").textContent = "";
  try {
    const r = await fetch("/api/setup", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ key: $("key").value.trim(), ...($("sun").value.trim() ? { sunbird: $("sun").value.trim() } : {}) }) });
    if (r.ok) { location.href = "/"; return; }
    $("msg").textContent = r.status === 403 ? "Callie is already set up." : "One of the keys doesn't look right. Please check it and try again.";
    if (r.status === 403) setTimeout(() => (location.href = "/"), 1200);
  } catch (e) { $("msg").textContent = "Please try again."; }
};
$("key").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
$("sun").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
</script></body></html>
