<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="icons/icon-192.png"><title>Welcome to Callie</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0b0d;color:#f4f4f5;font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:20px}
.card{width:100%;max-width:440px;background:#141417;border:1px solid #26262b;border-radius:24px;padding:32px;text-align:center}
img{width:84px;height:84px;border-radius:20px}h1{margin:14px 0 6px;font-size:1.6rem}p{color:#8b8b93;line-height:1.55;margin:0 0 18px}
input[type=text]{width:100%;padding:14px;border-radius:14px;border:1px solid #33333a;background:#0b0b0d;color:#fff;font:inherit;font-size:16px;margin-bottom:14px}
label{display:flex;gap:10px;align-items:flex-start;text-align:left;color:#a1a1aa;font-size:.85rem;line-height:1.5;margin-bottom:16px;cursor:pointer}label input{margin-top:3px;accent-color:#22c55e}
button{width:100%;padding:14px;border:0;border-radius:14px;background:#22c55e;color:#04210f;font:inherit;font-weight:700;cursor:pointer}
#msg{min-height:1.3em;margin:12px 0 0;color:#ffb4b4;font-size:.9rem}small{display:block;margin-top:22px;color:#6c6c75}
</style></head><body><div class="card">
<img src="icons/icon-192.png" alt=""><h1>Welcome to Callie</h1>
<p>Enter the invite code you were given to get started.</p>
<input id="code" type="text" placeholder="Invite code" autocomplete="off" autocapitalize="off">
<label><input id="agree" type="checkbox"><span>I understand that Callie is an AI and can make mistakes, that it is not a substitute for professional, medical or emergency help, and that what I say is processed by our service partners only to understand me and reply. No recordings are kept.</span></label>
<button id="go">Continue</button><p id="msg"></p><small>Built in Uganda, by Bryt Ma Tech UG</small></div>
<script>
const $ = id => document.getElementById(id);
$("go").onclick = async () => {
  $("msg").textContent = "";
  if (!$("agree").checked) { $("msg").textContent = "Please tick the box to continue."; return; }
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ code: $("code").value.trim(), agree: true }) });
    if (r.ok) { location.href = "/"; return; }
    $("msg").textContent = r.status === 429 ? "Too many tries. Please wait a minute." : "That code doesn't look right. Please check it and try again.";
  } catch (e) { $("msg").textContent = "Please check your connection and try again."; }
};
$("code").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
</script></body></html>
