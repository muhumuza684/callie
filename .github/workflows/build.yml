name: Build Callie

# Push a tag like v26 (the "Publish a release" option in the launcher does this) and GitHub builds the
# Windows, Mac and Linux apps and attaches them to a Release. "Run workflow" builds without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-base.txt -r requirements-dev.txt
      - run: python -m pytest -q tests

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, asset: Callie-windows.exe }
          - { os: ubuntu-latest, asset: Callie-linux }
          - { os: macos-latest, asset: Callie-macos }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-base.txt pyinstaller
      - run: pyinstaller --noconfirm callie.spec
      - name: Name the Windows file
        if: runner.os == 'Windows'
        shell: bash
        run: mv dist/Callie.exe "dist/${{ matrix.asset }}"
      - name: Pack the Mac and Linux file
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x dist/Callie
          tar -czf "dist/${{ matrix.asset }}.tar.gz" -C dist Callie
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
