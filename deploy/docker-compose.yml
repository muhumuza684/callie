# Callie + automatic https.  Run from this folder:  docker compose up -d --build
services:
  callie:
    build: ..
    restart: unless-stopped
    env_file: .env
    volumes:
      - callie_data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - callie

volumes:
  callie_data:
  caddy_data:
  caddy_config:
